name: Windows portable build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install Node.js for the embedded frontend build
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: WebClient/package-lock.json
      - name: Compile test harness (no private save required)
        shell: pwsh
        run: |
          dotnet build Tests/ZaTool.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish self-contained Windows x64 application
        shell: pwsh
        run: ./build.ps1
      - name: Run local API regression checks with a generated save
        shell: pwsh
        run: |
          dotnet run --project HostTests/HostTests.csproj -- --generated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: RecompPokemon-win-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
